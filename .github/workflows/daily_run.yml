name: Daily FG Stock Report

on:
  schedule:
    # 1:41 AM Dhaka Time = 19:41 UTC 
    - cron: "41 19 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  run-script:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "ODOO_URL=${{ secrets.ODOO_URL }}" >> .env
          echo "ODOO_DB=${{ secrets.ODOO_DB }}" >> .env
          echo "ODOO_USERNAME=${{ secrets.ODOO_USERNAME }}" >> .env
          echo "ODOO_PASSWORD=${{ secrets.ODOO_PASSWORD }}" >> .env
          echo "ODOO_API_KEY=${{ secrets.ODOO_API_KEY }}" >> .env

      - name: Create Credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > Credentials.json

      - name: Run FG Stock Script
        run: python fg_stock.py

      - name: Run FG Pack Script
        run: python fg_pack.py

      - name: Send Telegram Notification
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Daily Automation Success*%0AFG Stock and FG Pack scripts ran successfully on GitHub Actions." \
          -d parse_mode="Markdown"
